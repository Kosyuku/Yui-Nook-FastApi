// ===== components/ornaments.jsx =====
// 小元件：丝带书签、印章、手写标签、胶带、便签贴纸

// ─────────────────────────────────────────────
// 丝带书签（从书页顶部垂下来）
// ─────────────────────────────────────────────
function Ribbon({ color = '#D9A5A0', top = -4, right = 22, length = 48 }) {
  return (
    <div style={{
      position: 'absolute', top, right, width: 10, height: length,
      pointerEvents: 'none', zIndex: 2
    }}>
      <div style={{
        width: '100%', height: length - 6,
        background: `linear-gradient(180deg, ${color} 0%, ${color} 60%, ${shade(color, -12)} 100%)`,
        boxShadow: `inset -2px 0 0 ${shade(color, -18)}`
      }} />
      {/* 尾端三角缺口 */}
      <svg width="10" height="8" viewBox="0 0 10 8" style={{ display: 'block' }}>
        <polygon points="0,0 10,0 5,8" fill={shade(color, -10)} />
      </svg>
    </div>);

}

// ─────────────────────────────────────────────
// 胶带（半透明，可旋转）
// ─────────────────────────────────────────────
function Tape({ color = 'rgba(246, 220, 196, 0.75)', width = 64, height = 20, rotate = -6, style = {} }) {
  return (
    <div style={{
      width, height, background: color,
      transform: `rotate(${rotate}deg)`,
      boxShadow: '0 1px 2px rgba(100, 70, 50, 0.08)',
      backgroundImage: `repeating-linear-gradient(90deg,
        transparent 0, transparent 3px,
        rgba(255,255,255,0.25) 3px, rgba(255,255,255,0.25) 6px)`,
      ...style
    }} />);

}

// ─────────────────────────────────────────────
// 邮票小印章（圆形 + 文字）
// ─────────────────────────────────────────────
function Stamp({ text = '私', color = '#B84A3E', size = 38, rotate = -8, style = {} }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      border: `1.5px solid ${color}`, color,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '"Noto Serif SC", serif', fontSize: size * 0.42, fontWeight: 700,
      background: 'rgba(184, 74, 62, 0.04)',
      transform: `rotate(${rotate}deg)`,
      opacity: 0.82,
      letterSpacing: 1,
      boxShadow: 'inset 0 0 0 1px rgba(184, 74, 62, 0.15)',
      ...style
    }}>
      <span style={{
        textShadow: '0 0 2px rgba(255,251,244,0.4)',
        filter: 'blur(0.15px)'
      }}>{text}</span>
    </div>);

}

// ─────────────────────────────────────────────
// 手写标签（歪歪扭扭的一行）
// ─────────────────────────────────────────────
function Scribble({ children, rotate = -2, fontSize = 14, color = '#6B5F58', style = {} }) {
  return (
    <span style={{
      fontFamily: window.DD_FONTS.handCn, fontSize, color,
      transform: `rotate(${rotate}deg)`, display: 'inline-block',
      letterSpacing: 1, ...style
    }}>{children}</span>);

}

// ─────────────────────────────────────────────
// 纸纹：重叠的径向 + 噪点（CSS only）
// ─────────────────────────────────────────────
function paperTexture(tint = '#FBF7F2') {
  return {
    background: `
      radial-gradient(ellipse 900px 500px at 20% 10%, rgba(255,240,220,0.4), transparent),
      radial-gradient(ellipse 700px 400px at 80% 90%, rgba(240,220,230,0.35), transparent),
      ${tint}`
  };
}

// ─────────────────────────────────────────────
// 小 util
// ─────────────────────────────────────────────
function shade(hex, amt) {
  // 简单亮度调整
  const n = hex.replace('#', '');
  const r = Math.max(0, Math.min(255, parseInt(n.slice(0, 2), 16) + amt));
  const g = Math.max(0, Math.min(255, parseInt(n.slice(2, 4), 16) + amt));
  const b = Math.max(0, Math.min(255, parseInt(n.slice(4, 6), 16) + amt));
  return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
}

Object.assign(window, { Ribbon, Tape, Stamp, Scribble, paperTexture, shade });

// 砖墙网格：3 列，每行高度不同 + 偶尔一张横跨 2 列
function BrickGrid({ photos }) {
  // 分成几"段"：常规 3 张 + 大+小 两张 + 常规 3 张
  const chunks = [];
  let i = 0;
  let flip = false;
  while (i < photos.length) {
    if (flip && i + 3 <= photos.length) {
      chunks.push({ kind: 'wide', items: photos.slice(i, i + 3) });
      i += 3;
    } else {
      chunks.push({ kind: 'tri', items: photos.slice(i, i + 3) });
      i += 3;
    }
    flip = !flip;
  }

  return (
    <div style={{ padding: '4px 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
      {chunks.map((c, idx) =>
      c.kind === 'tri' ?
      <TriRow key={idx} items={c.items} offset={idx} /> :
      <WideRow key={idx} items={c.items} offset={idx} />
      )}
    </div>);

}

function TriRow({ items, offset }) {
  // 三格等宽，第一格比其它高一点制造不齐
  const heights = offset % 2 === 0 ? [132, 112, 124] : [116, 128, 116];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
      {items.map((p, i) => <PhotoCell key={p.id} p={p} h={heights[i]} />)}
    </div>);

}

function WideRow({ items, offset }) {
  // 第一张横跨 2 列 + 右边竖排两张小图
  const [a, b, c] = items;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 8 }}>
      <PhotoCell p={a} h={176} wide />
      <div style={{ display: 'grid', gridTemplateRows: '1fr 1fr', gap: 8 }}>
        {b && <PhotoCell p={b} h={84} />}
        {c && <PhotoCell p={c} h={84} />}
      </div>
    </div>);

}

function PhotoCell({ p, h, wide }) {
  const F = window.DD_FONTS;
  return (
    <div style={{
      position: 'relative', height: h,
      background: p.tint,
      backgroundImage: `url(${p.src})`,
      backgroundSize: 'cover', backgroundPosition: 'center',
      borderRadius: 2,
      overflow: 'hidden',
      cursor: 'pointer'
    }}>
      {/* 白内描（像相纸边） */}
      <div style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        boxShadow: 'inset 0 0 0 3px #FFFDF8, inset 0 0 0 4px rgba(0,0,0,0.06)'
      }} />
      {/* 标签仅 hero/wide 显示 */}
      {wide && p.label &&
      <div style={{
        position: 'absolute', left: 10, bottom: 10,
        padding: '3px 8px',
        background: 'rgba(255,253,248,0.86)',
        fontFamily: F.handCn, fontSize: 12, color: '#2B2420',
        letterSpacing: 1
      }}>{p.label}</div>
      }
    </div>);

}

// ===== components/perle-music-b.jsx =====
// Perle · 方向 B · 音乐
// 大圆光晕（呼吸） + 歌词聚焦（一次只突出当前一行）
// 比 A 更"氛围/情绪"向；没有波形，用一个会呼吸的色光圆 + 旋转碟片纹

function PerleMusicB({ initialTrack = 0, onBack }) {
  const { useState, useEffect } = React;
  const F = window.DD_FONTS;
  const tracks = window.PERLE_TRACKS;
  const lyrics = window.PERLE_LYRICS;

  const [trackIdx, setTrackIdx] = useState(initialTrack);
  const [t, setT] = useState(28);
  const [playing, setPlaying] = useState(true);
  const [queueOpen, setQueueOpen] = useState(false);
  const track = tracks[trackIdx];

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setT((s) => (s + 1) % track.duration), 1000);
    return () => clearInterval(id);
  }, [playing, track.duration]);

  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const progress = t / track.duration;

  const activeIdx = (() => {
    let i = 0;
    for (let k = 0; k < lyrics.length; k++) if (lyrics[k].t <= t) i = k;
    return i;
  })();

  // 上下两行作为辅助
  const lyricFocus = lyrics[activeIdx];
  const lyricPrev = lyrics[activeIdx - 1];
  const lyricNext = lyrics[activeIdx + 1];

  return (
    <div style={{
      width: '100%', height: '100%',
      background: '#F8F4F8',
      backgroundImage: `radial-gradient(ellipse 800px 600px at 50% 30%, ${track.accent}40, transparent 60%), radial-gradient(ellipse 600px 400px at 50% 80%, rgba(170,150,200,0.22), transparent)`,
      overflow: 'hidden', position: 'relative',
      display: 'flex', flexDirection: 'column'
    }}>
      {/* 顶部 */}
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '10px 16px 4px', flexShrink: 0
      }}>
        <div onClick={onBack} style={{ width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', marginLeft: -6 }}>
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none">
            <path d="M10 2 L2 10 L10 18" stroke="#2B2420" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </div>
        <div style={{
          fontFamily: F.handEn, fontSize: 16, color: '#9E8894'
        }}>now playing</div>
        <div onClick={() => setQueueOpen(true)} style={{ width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', marginRight: -6 }}>
          {/* 歌单图标：三横线 */}
          <svg width="20" height="14" viewBox="0 0 20 14" fill="none">
            <path d="M2 2 H18 M2 7 H18 M2 12 H12" stroke="#2B2420" strokeWidth="1.2" strokeLinecap="round" />
          </svg>
        </div>
      </div>

      {/* 呼吸圆 */}
      <div style={{
        padding: '20px 0 8px',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexShrink: 0
      }}>
        <BreathOrb accent={track.accent} playing={playing} title={track.title} />
      </div>

      {/* 元信息 */}
      <div style={{
        padding: '4px 24px 0', textAlign: 'center', flexShrink: 0
      }}>
        <div style={{
          fontFamily: F.serifEn, fontStyle: 'italic', fontSize: 14,
          color: track.accent, letterSpacing: 1, marginBottom: 4
        }}>{track.titleEn}</div>
        <div style={{
          fontFamily: F.serifCn, fontSize: 11, color: '#9E8894',
          letterSpacing: 3
        }}>{track.artist}　·　{track.album}</div>
      </div>

      {/* 歌词聚焦 */}
      <div style={{
        flex: 1, minHeight: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: '0 28px', height: "1px"
      }}>
        <div style={{ textAlign: 'center', width: '100%' }}>
          <div style={{
            fontFamily: F.serifCn, fontSize: 13,
            color: '#C2B5BC', letterSpacing: 1.5, lineHeight: 1.5,
            minHeight: 22
          }}>{lyricPrev?.text || ''}</div>
          <div style={{
            fontFamily: F.serifCn, fontSize: 22, fontWeight: 600,
            color: '#2B2420', letterSpacing: 3, lineHeight: 1.4,
            margin: '14px 0',
            minHeight: 32
          }}>{lyricFocus?.text || '⋯'}</div>
          <div style={{
            fontFamily: F.serifCn, fontSize: 13,
            color: '#C2B5BC', letterSpacing: 1.5, lineHeight: 1.5,
            minHeight: 22
          }}>{lyricNext?.text || ''}</div>
        </div>
      </div>

      {/* 进度条（细线） */}
      <div style={{ padding: '8px 28px 6px', flexShrink: 0 }}>
        <div style={{
          height: 2, background: 'rgba(150,120,130,0.18)', position: 'relative'
        }}>
          <div style={{
            position: 'absolute', left: 0, top: 0, bottom: 0,
            width: `${progress * 100}%`, background: track.accent,
            transition: 'width 0.5s linear'
          }} />
          <div style={{
            position: 'absolute', top: -3, left: `${progress * 100}%`,
            transform: 'translateX(-50%)',
            width: 8, height: 8, borderRadius: '50%',
            background: track.accent
          }} />
        </div>
        <div style={{
          display: 'flex', justifyContent: 'space-between', marginTop: 6,
          fontFamily: F.serifEn, fontSize: 11, fontStyle: 'italic',
          color: '#A89C93'
        }}>
          <span>{fmt(t)}</span>
          <span>{fmt(track.duration)}</span>
        </div>
      </div>

      {/* 控件 */}
      <div style={{
        padding: '8px 24px 28px',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 32, flexShrink: 0
      }}>
        <CtrlIcon onClick={() => setTrackIdx((i) => (i - 1 + tracks.length) % tracks.length)}>
          <svg width="22" height="22" viewBox="0 0 22 22"><path d="M16 4 L8 11 L16 18 M6 4 V18" stroke="#2B2420" strokeWidth="1.3" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </CtrlIcon>
        <div onClick={() => setPlaying((p) => !p)} style={{
          width: 56, height: 56, borderRadius: '50%',
          background: track.accent,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer'
        }}>
          {playing ?
          <svg width="18" height="20" viewBox="0 0 18 20"><rect x="2" y="2" width="4.5" height="16" fill="#FFFDF8" /><rect x="11.5" y="2" width="4.5" height="16" fill="#FFFDF8" /></svg> :

          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 3 L17 10 L5 17 Z" fill="#FFFDF8" /></svg>
          }
        </div>
        <CtrlIcon onClick={() => setTrackIdx((i) => (i + 1) % tracks.length)}>
          <svg width="22" height="22" viewBox="0 0 22 22"><path d="M6 4 L14 11 L6 18 M16 4 V18" stroke="#2B2420" strokeWidth="1.3" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </CtrlIcon>
      </div>

      {/* 歌单抽屉 */}
      <QueueDrawer
        open={queueOpen}
        onClose={() => setQueueOpen(false)}
        tracks={tracks}
        activeIdx={trackIdx}
        onPick={(i) => {setTrackIdx(i);setT(0);setQueueOpen(false);}} />
      
    </div>);

}

          <div>
            <div style={{

              fontFamily: F.handEn, fontSize: 13, color: '#9E8894', marginTop: 2

                {/* 色块（代替封面） */}

                  width: 40, height: 40, flexShrink: 0,

                <div style={{ flex: 1, minWidth: 0 }}>

window.PerleMusicB = PerleMusicB;



function MusicApp() {
  const { useState, useEffect } = React;
  const [screen, setScreen] = useState('library'); // library | player
  const [trackIdx, setTrackIdx] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [mounted, setMounted] = useState(false); // 控制 player DOM 是否在
  const [shown, setShown] = useState(false);     // 控制 player 是否滑到位

  const openPlayer = (i) => {
    if (i !== undefined) {setTrackIdx(i);setPlaying(true);}
    setScreen('player');
    setMounted(true);
    // 下一帧再触发动画（让 transform 从 100% → 0）
    requestAnimationFrame(() => {
      requestAnimationFrame(() => setShown(true));
    });
  };
  const closePlayer = () => {
    setShown(false);
    setScreen('library');
    setTimeout(() => setMounted(false), 480);
  };

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%' }}>
        <PerleMusicLibrary
        activeIdx={trackIdx}
        playing={playing}
        onPick={openPlayer}
        onOpenPlayer={() => openPlayer()} />
      
        {mounted &&
      <div style={{
        position: 'absolute', inset: 0, zIndex: 10,
        transform: shown ? 'translateY(0) scale(1)' : 'translateY(100%) scale(0.94)',
        opacity: shown ? 1 : 0.4,
        transformOrigin: 'center bottom',
        transition: 'transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease',
        boxShadow: shown ? '0 -20px 60px rgba(80,50,80,0.18)' : 'none',
        background: 'inherit'
      }}>
            <PerleMusicB
          initialTrack={trackIdx}
          onBack={closePlayer} />
        
          </div>
      }
      </div>);

}

}
